<div class="settings-container">
  <h1>Admin Settings</h1>
  
  <div class="settings-card">
    <h2>Profile Settings</h2>
    <div class="form-group">
      <label>Name</label>
      <input type="text" [(ngModel)]="settings.name">
    </div>
    <div class="form-group">
      <label>Email</label>
      <input type="email" [(ngModel)]="settings.email">
    </div>
  </div>

  <div class="settings-card">
    <h2>System Preferences</h2>
    <div class="form-group checkbox">
      <input type="checkbox" id="notifications" [(ngModel)]="settings.notifications">
      <label for="notifications">Enable Email Notifications</label>
    </div>
    <div class="form-group checkbox">
      <input type="checkbox" id="autoApprove" [(ngModel)]="settings.autoApprove">
      <label for="autoApprove">Auto Approve Notes</label>
    </div>
    <div class="form-group">
      <label>Max File Size (MB)</label>
      <input type="text" [(ngModel)]="settings.maxFileSize">
    </div>
  </div>

  <button class="btn-save" (click)="saveSettings()">Save Changes</button>
</div>
