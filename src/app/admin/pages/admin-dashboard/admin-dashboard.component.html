<div class="dashboard">
  <!-- Header with Search Bar -->
  <div class="dashboard-header">
    <h1>Admin Dashboard</h1>
    <div class="header-actions">
      <div class="search-bar">
        <svg width="20" height="20" viewBox="0 0 16 16" fill="currentColor">
          <path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001c.03.04.062.078.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1.007 1.007 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0z"/>
        </svg>
        <input type="text" placeholder="Search..." [(ngModel)]="searchQuery">
      </div>

    </div>
  </div>
  
  <!-- Quick Action Buttons -->
  <div class="action-buttons">
    <button class="action-btn orange" routerLink="/admin/manage-users">
      <div class="btn-icon">
        <svg width="32" height="32" viewBox="0 0 16 16" fill="currentColor">
          <path d="M15 14s1 0 1-1-1-4-5-4-5 3-5 4 1 1 1 1h8zm-7.978-1A.261.261 0 0 1 7 12.996c.001-.264.167-1.03.76-1.72C8.312 10.629 9.282 10 11 10c1.717 0 2.687.63 3.24 1.276.593.69.758 1.457.76 1.72l-.008.002a.274.274 0 0 1-.014.002H7.022zM11 7a2 2 0 1 0 0-4 2 2 0 0 0 0 4zm3-2a3 3 0 1 1-6 0 3 3 0 0 1 6 0z"/>
        </svg>
      </div>
      <div class="btn-info">
        <span class="btn-label">Manage Users</span>
        <span class="btn-value">{{ stats[3].value || '0' }}</span>
      </div>
    </button>

    <button class="action-btn green" routerLink="/admin/notes">
      <div class="btn-icon">
        <svg width="32" height="32" viewBox="0 0 16 16" fill="currentColor">
          <path d="M14 4.5V14a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V2a2 2 0 0 1 2-2h5.5L14 4.5zm-3 0A1.5 1.5 0 0 1 9.5 3V1H4a1 1 0 0 0-1 1v12a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1V4.5h-2z"/>
        </svg>
      </div>
      <div class="btn-info">
        <span class="btn-label">Manage Notes</span>
        <span class="btn-value">{{ stats[1].value || '0' }}</span>
      </div>
    </button>

    <button class="action-btn red" routerLink="/admin/teacher">
      <div class="btn-icon">
        <svg width="32" height="32" viewBox="0 0 16 16" fill="currentColor">
          <path d="M8 8a3 3 0 1 0 0-6 3 3 0 0 0 0 6zm0 1a6.065 6.065 0 0 0-4.243 1.757A6.065 6.065 0 0 0 2 15h12a6.065 6.065 0 0 0-1.757-4.243A6.065 6.065 0 0 0 8 9z"/>
        </svg>
      </div>
      <div class="btn-info">
        <span class="btn-label">Manage Teachers</span>
        <span class="btn-value">{{ stats[0].value || '0' }}</span>
      </div>
    </button>

    <button class="action-btn blue">
      <div class="btn-icon">
        <svg width="32" height="32" viewBox="0 0 16 16" fill="currentColor">
          <path d="M10.854 7.146a.5.5 0 0 1 0 .708l-3 3a.5.5 0 0 1-.708 0l-1.5-1.5a.5.5 0 1 1 .708-.708L7.5 9.793l2.646-2.647a.5.5 0 0 1 .708 0z"/>
          <path d="M8 1a2.5 2.5 0 0 1 2.5 2.5V4h-5v-.5A2.5 2.5 0 0 1 8 1zm3.5 3v-.5a3.5 3.5 0 1 0-7 0V4H1v10a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V4h-3.5z"/>
        </svg>
      </div>
      <div class="btn-info">
        <span class="btn-label">Active Today</span>
        <span class="btn-value">{{ stats[2].value || '0' }}</span>
      </div>
    </button>
  </div>

  <div class="recent-section">
    <div class="section-header">
      <h2>Recent Uploaded Notes</h2>
      <div class="header-actions">

      </div>
    </div>
    <div class="activities-list" *ngIf="recentActivities.length > 0">
      <div class="activity-item" *ngFor="let activity of recentActivities">
        <div class="activity-icon">
          <svg width="20" height="20" viewBox="0 0 16 16" fill="currentColor">
            <path d="M14 4.5V14a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V2a2 2 0 0 1 2-2h5.5L14 4.5zm-3 0A1.5 1.5 0 0 1 9.5 3V1H4a1 1 0 0 0-1 1v12a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1V4.5h-2z"/>
          </svg>
        </div>
        <div class="activity-info">
          <h4>{{ activity.user }}</h4>
          <p>{{ activity.action }}</p>
        </div>
        <span class="activity-time">{{ activity.time }}</span>
      </div>
    </div>
  </div>
</div>
