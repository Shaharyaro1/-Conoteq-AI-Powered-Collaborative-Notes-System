<div class="login-container">
  <div class="login-box">
    <div class="login-header">
      <!-- SVG Logo -->
      <div class="logo-container">
        <svg class="logo" width="60" height="60" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="brainGradient" x1="0%" y1="0%" x2="100%" y2="100%">
              <animate attributeName="x1" values="0%;100%;0%" dur="4s" repeatCount="indefinite"/>
              <animate attributeName="y1" values="0%;100%;0%" dur="4s" repeatCount="indefinite"/>
              <stop offset="0%" style="stop-color:#49017F;stop-opacity:1" />
              <stop offset="100%" style="stop-color:#7b1fa2;stop-opacity:1" />
            </linearGradient>
          </defs>
          <circle cx="50" cy="50" r="45" fill="url(#brainGradient)" opacity="0.15"/>
          <g class="brain-icon">
            <path d="M 30 40 Q 25 35, 25 30 Q 25 20, 35 20 Q 40 20, 42 25 Q 44 20, 50 20 Q 56 20, 58 25 Q 60 20, 65 20 Q 75 20, 75 30 Q 75 35, 70 40" fill="none" stroke="#49017F" stroke-width="3" stroke-linecap="round">
              <animate attributeName="stroke-dasharray" values="0,200;200,0;0,200" dur="3s" repeatCount="indefinite"/>
            </path>
            <path d="M 30 40 Q 30 50, 35 55 Q 40 60, 50 60 Q 60 60, 65 55 Q 70 50, 70 40" fill="none" stroke="#49017F" stroke-width="3" stroke-linecap="round">
              <animate attributeName="stroke-dasharray" values="0,150;150,0;0,150" dur="3s" repeatCount="indefinite" begin="0.5s"/>
            </path>
            <circle cx="35" cy="45" r="2" fill="#49017F">
              <animate attributeName="r" values="2;3;2" dur="2s" repeatCount="indefinite"/>
            </circle>
            <circle cx="50" cy="48" r="2" fill="#49017F">
              <animate attributeName="r" values="2;3;2" dur="2s" repeatCount="indefinite" begin="0.3s"/>
            </circle>
            <circle cx="65" cy="45" r="2" fill="#49017F">
              <animate attributeName="r" values="2;3;2" dur="2s" repeatCount="indefinite" begin="0.6s"/>
            </circle>
            <path d="M 42 70 Q 50 75, 58 70" fill="none" stroke="#49017F" stroke-width="2.5" stroke-linecap="round"/>
          </g>
        </svg>
      </div>
      
      <h1>Conoteq</h1>
      <p>AI-Powered Collaborative Notes System</p>
    </div>

    <form (ngSubmit)="login()">
      <div class="form-group">
        <label>Username</label>
        <input 
          type="text" 
          [(ngModel)]="username" 
          name="username"
          placeholder="Enter your username"
          required>
      </div>

      <div class="form-group">
        <label>Password</label>
        <div class="password-input-wrapper">
          <input 
            [type]="showPassword ? 'text' : 'password'" 
            [(ngModel)]="password" 
            name="password"
            placeholder="Enter your password"
            required>
          <button 
            type="button" 
            class="toggle-password" 
            (click)="togglePasswordVisibility()"
            tabindex="-1">
            <svg *ngIf="!showPassword" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
            <svg *ngIf="showPassword" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
              <line x1="1" y1="1" x2="23" y2="23"></line>
            </svg>
          </button>
        </div>
      </div>

      <div class="error-message" *ngIf="errorMessage">
        {{ errorMessage }}
      </div>

      <button type="submit" class="btn-login">Login</button>
    </form>

    <div class="divider">
      <span>OR</span>
    </div>

    <div class="social-login">
      <button type="button" class="btn-social btn-google">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
        </svg>
        Continue with Google
      </button>
      <button type="button" class="btn-social btn-facebook">
        <svg viewBox="0 0 24 24" fill="#1877F2">
          <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
        </svg>
        Continue with Facebook
      </button>
    </div>

    <div class="signup-link">
      Don't have an account? <a routerLink="/auth/signup">Sign Up</a>
    </div>
  </div>
</div>
