<div class="profile-container">
  <h1>My Profile</h1>
  
  <div class="profile-content">
    <!-- Profile Image Section -->
    <div class="profile-image-card">
      <div class="avatar-container">
        <div class="avatar-circle">
          {{ getInitials() }}
        </div>
        <button class="btn-change-photo" *ngIf="isEditing">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
            <path d="M10.5 8.5a2.5 2.5 0 1 1-5 0 2.5 2.5 0 0 1 5 0z"/>
            <path d="M2 4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2h-1.172a2 2 0 0 1-1.414-.586l-.828-.828A2 2 0 0 0 9.172 2H6.828a2 2 0 0 0-1.414.586l-.828.828A2 2 0 0 1 3.172 4H2zm.5 2a.5.5 0 1 1 0-1 .5.5 0 0 1 0 1zm9 2.5a3.5 3.5 0 1 1-7 0 3.5 3.5 0 0 1 7 0z"/>
          </svg>
          Change Photo
        </button>
      </div>
      <div class="user-info-summary">
        <h3>{{ userProfile.name }}</h3>
        <p>{{ userProfile.email }}</p>
      </div>
    </div>

    <!-- Profile Form Section -->
    <div class="profile-form-card">
      <div class="form-header">
        <h2>Personal Information</h2>
        <div class="form-actions">
          <button class="btn-edit" *ngIf="!isEditing" (click)="toggleEdit()">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
              <path d="M12.146.146a.5.5 0 0 1 .708 0l3 3a.5.5 0 0 1 0 .708l-10 10a.5.5 0 0 1-.168.11l-5 2a.5.5 0 0 1-.65-.65l2-5a.5.5 0 0 1 .11-.168l10-10zM11.207 2.5 13.5 4.793 14.793 3.5 12.5 1.207 11.207 2.5zm1.586 3L10.5 3.207 4 9.707V10h.5a.5.5 0 0 1 .5.5v.5h.5a.5.5 0 0 1 .5.5v.5h.293l6.5-6.5zm-9.761 5.175-.106.106-1.528 3.821 3.821-1.528.106-.106A.5.5 0 0 1 5 12.5V12h-.5a.5.5 0 0 1-.5-.5V11h-.5a.5.5 0 0 1-.468-.325z"/>
            </svg>
            Edit Profile
          </button>
          <button class="btn-save" *ngIf="isEditing" (click)="toggleEdit()">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
              <path d="M13.854 3.646a.5.5 0 0 1 0 .708l-7 7a.5.5 0 0 1-.708 0l-3.5-3.5a.5.5 0 1 1 .708-.708L6.5 10.293l6.646-6.647a.5.5 0 0 1 .708 0z"/>
            </svg>
            Save Changes
          </button>
          <button class="btn-cancel" *ngIf="isEditing" (click)="cancelEdit()">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
              <path d="M4.646 4.646a.5.5 0 0 1 .708 0L8 7.293l2.646-2.647a.5.5 0 0 1 .708.708L8.707 8l2.647 2.646a.5.5 0 0 1-.708.708L8 8.707l-2.646 2.647a.5.5 0 0 1-.708-.708L7.293 8 4.646 5.354a.5.5 0 0 1 0-.708z"/>
            </svg>
            Cancel
          </button>
        </div>
      </div>

      <div class="form-grid">
        <div class="form-field">
          <label>Full Name</label>
          <input 
            type="text" 
            [(ngModel)]="userProfile.name"
            [readonly]="!isEditing"
            [class.editing]="isEditing"
            placeholder="Enter your full name">
        </div>

        <div class="form-field">
          <label>Email Address</label>
          <input 
            type="email" 
            [(ngModel)]="userProfile.email"
            [readonly]="!isEditing"
            [class.editing]="isEditing"
            placeholder="Enter your email">
        </div>

        <div class="form-field">
          <label>Phone Number</label>
          <input 
            type="tel" 
            [(ngModel)]="userProfile.phone"
            [readonly]="!isEditing"
            [class.editing]="isEditing"
            placeholder="Enter your phone number">
        </div>

        <div class="form-field">
          <label>Address</label>
          <input 
            type="text" 
            [(ngModel)]="userProfile.address"
            [readonly]="!isEditing"
            [class.editing]="isEditing"
            placeholder="Enter your address">
        </div>

        <div class="form-field full-width">
          <label>Bio</label>
          <textarea 
            [(ngModel)]="userProfile.bio"
            [readonly]="!isEditing"
            [class.editing]="isEditing"
            rows="4"
            placeholder="Tell us about yourself..."></textarea>
        </div>
      </div>
    </div>
  </div>
</div>
