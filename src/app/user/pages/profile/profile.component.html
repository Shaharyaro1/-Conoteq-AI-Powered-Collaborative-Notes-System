<div class="dashboard">
  <!-- Header -->
  <div class="header">
    <h1>My Profile</h1>
  </div>

  <!-- Loading State -->
  <div *ngIf="isLoading" class="loading-state">
    <div class="spinner"></div>
    <p>Loading profile...</p>
  </div>

  <!-- Error Message -->
  <div *ngIf="errorMessage" class="error-message">
    <svg width="20" height="20" viewBox="0 0 16 16" fill="currentColor">
      <path d="M8 15A7 7 0 1 1 8 1a7 7 0 0 1 0 14zm0 1A8 8 0 1 0 8 0a8 8 0 0 0 0 16z"/>
      <path d="M7.002 11a1 1 0 1 1 2 0 1 1 0 0 1-2 0zM7.1 4.995a.905.905 0 1 1 1.8 0l-.35 3.507a.552.552 0 0 1-1.1 0L7.1 4.995z"/>
    </svg>
    {{ errorMessage }}
  </div>

  <!-- Success Message -->
  <div *ngIf="successMessage" class="success-message">
    <svg width="20" height="20" viewBox="0 0 16 16" fill="currentColor">
      <path d="M13.854 3.646a.5.5 0 0 1 0 .708l-7 7a.5.5 0 0 1-.708 0l-3.5-3.5a.5.5 0 1 1 .708-.708L6.5 10.293l6.646-6.647a.5.5 0 0 1 .708 0z"/>
    </svg>
    {{ successMessage }}
  </div>
  
  <!-- Main Content Container -->
  <div class="dashboard-content" *ngIf="!isLoading">
    <!-- Profile Image Section -->
    <div class="profile-image-card">
      <div class="avatar-container">
        <div class="avatar-circle">
          {{ getInitials() }}
        </div>
      </div>
      <div class="user-info-summary">
        <h3>{{ userProfile.name }}</h3>
        <p>{{ userProfile.email }}</p>
        <span class="user-role">{{ userProfile.role | titlecase }}</span>
        <span class="user-status" [class]="userProfile.status">{{ userProfile.status | titlecase }}</span>
      </div>
    </div>

    <!-- Profile Form Section -->
    <div class="profile-form-card">
      <div class="form-header">
        <h2>Personal Information</h2>
        <div class="form-actions">
          <button class="btn-edit" *ngIf="!isEditing" (click)="toggleEdit()" [disabled]="isLoading">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
              <path d="M12.146.146a.5.5 0 0 1 .708 0l3 3a.5.5 0 0 1 0 .708l-10 10a.5.5 0 0 1-.168.11l-5 2a.5.5 0 0 1-.65-.65l2-5a.5.5 0 0 1 .11-.168l10-10zM11.207 2.5 13.5 4.793 14.793 3.5 12.5 1.207 11.207 2.5zm1.586 3L10.5 3.207 4 9.707V10h.5a.5.5 0 0 1 .5.5v.5h.5a.5.5 0 0 1 .5.5v.5h.293l6.5-6.5zm-9.761 5.175-.106.106-1.528 3.821 3.821-1.528.106-.106A.5.5 0 0 1 5 12.5V12h-.5a.5.5 0 0 1-.5-.5V11h-.5a.5.5 0 0 1-.468-.325z"/>
            </svg>
            Edit Profile
          </button>
          <button class="btn-save" *ngIf="isEditing" (click)="toggleEdit()" [disabled]="isLoading">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
              <path d="M13.854 3.646a.5.5 0 0 1 0 .708l-7 7a.5.5 0 0 1-.708 0l-3.5-3.5a.5.5 0 1 1 .708-.708L6.5 10.293l6.646-6.647a.5.5 0 0 1 .708 0z"/>
            </svg>
            {{ isLoading ? 'Saving...' : 'Save Changes' }}
          </button>
          <button class="btn-cancel" *ngIf="isEditing" (click)="cancelEdit()" [disabled]="isLoading">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
              <path d="M4.646 4.646a.5.5 0 0 1 .708 0L8 7.293l2.646-2.647a.5.5 0 0 1 .708.708L8.707 8l2.647 2.646a.5.5 0 0 1-.708.708L8 8.707l-2.646 2.647a.5.5 0 0 1-.708-.708L7.293 8 4.646 5.354a.5.5 0 0 1 0-.708z"/>
            </svg>
            Cancel
          </button>
        </div>
      </div>

      <div class="form-grid">
        <div class="form-field">
          <label>Username</label>
          <input 
            type="text" 
            [(ngModel)]="userProfile.username"
            [readonly]="!isEditing"
            [class.editing]="isEditing"
            placeholder="Enter your username">
        </div>

        <div class="form-field">
          <label>Email Address</label>
          <input 
            type="email" 
            [(ngModel)]="userProfile.email"
            [readonly]="!isEditing"
            [class.editing]="isEditing"
            placeholder="Enter your email">
        </div>

        <div class="form-field">
          <label>Role</label>
          <input 
            type="text" 
            [value]="userProfile.role | titlecase"
            readonly
            class="readonly-field"
            placeholder="User role">
        </div>

        <div class="form-field">
          <label>Account Status</label>
          <input 
            type="text" 
            [value]="userProfile.status | titlecase"
            readonly
            class="readonly-field"
            [class]="userProfile.status"
            placeholder="Account status">
        </div>

        <div class="form-field">
          <label>Member Since</label>
          <input 
            type="text" 
            [value]="formatDate(userProfile.createdAt)"
            readonly
            class="readonly-field"
            placeholder="Registration date">
        </div>

        <div class="form-field">
          <label>Last Active</label>
          <input 
            type="text" 
            [value]="formatDate(userProfile.lastActive)"
            readonly
            class="readonly-field"
            placeholder="Last activity">
        </div>
      </div>
    </div>
  </div>
</div>
